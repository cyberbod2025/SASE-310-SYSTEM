<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SASE | ESD 310</title>
    <link
      rel="icon"
      type="image/png"
      href="/assets/branding/SASE_ICON_PREMIUM.png"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="/assets/branding/SASE_ICON_PREMIUM.png" />
    <meta name="theme-color" content="#020617" />

    <!-- Google Fonts: Inter & Manrope (Institutional selection) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #020617; /* Institutional Dark Blue */
        color: #f8fafc;
        font-family: "Inter", sans-serif;
        overflow-x: hidden;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
    </style>
  </head>
  <body class="bg-[#020617] text-slate-50 antialiased selection:bg-blue-500/30">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch((err) => {
            console.log("SW registration failed: ", err);
          });
        });
      }
    </script>
  </body>
</html>
