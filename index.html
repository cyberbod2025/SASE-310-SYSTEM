<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SISTEMA SASE-310</title>
    <link
      rel="icon"
      type="image/png"
      href="/assets/branding/favicon.png"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="/assets/branding/favicon.png" />
    <meta name="theme-color" content="#020617" />

    <!-- Google Fonts: Inter & Manrope (Institutional selection) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    
    <!-- Material Icons (Fallback for existing components) -->
    <link 
      href="https://fonts.googleapis.com/icon?family=Material+Icons" 
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #020617; /* Institutional Dark Blue */
        color: #f8fafc;
        font-family: "Inter", sans-serif;
        overflow-x: hidden;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
    </style>
  </head>
  <body class="bg-[#020617] text-slate-50 antialiased selection:bg-blue-500/30">
    <div id="root"></div>
    <script>
      const devHosts = ["localhost", "127.0.0.1"];
      const isPrivateNetworkHost = /^(10\.|172\.(1[6-9]|2\d|3[0-1])\.|192\.168\.)/.test(window.location.hostname);
      const isDevPort = ["3100", "3101", "5173"].includes(window.location.port);
      const isDevRuntime = devHosts.includes(window.location.hostname) || isPrivateNetworkHost || isDevPort;
      const devCleanupFlag = "sase_dev_sw_cleanup_done";

      const loadApp = () => {
        const script = document.createElement("script");
        script.type = "module";
        script.src = "/src/index.tsx";
        document.body.appendChild(script);
      };

      window.addEventListener("load", async () => {
        if ("serviceWorker" in navigator && isDevRuntime) {
          try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            const hadServiceWorkers = registrations.length > 0 || Boolean(navigator.serviceWorker.controller);

            await Promise.all(registrations.map((registration) => registration.unregister()));

            if ("caches" in window) {
              const cacheNames = await caches.keys();
              await Promise.all(
                cacheNames
                  .filter((cacheName) => cacheName.startsWith("sase-cache"))
                  .map((cacheName) => caches.delete(cacheName)),
              );
            }

            if (hadServiceWorkers && !sessionStorage.getItem(devCleanupFlag)) {
              sessionStorage.setItem(devCleanupFlag, "1");
              window.location.reload();
              return;
            }
          } catch (err) {
            console.log("SW cleanup failed in dev:", err);
          }

          sessionStorage.removeItem(devCleanupFlag);
          loadApp();
          return;
        }

        if ("serviceWorker" in navigator && !isDevRuntime) {
          navigator.serviceWorker.register("/sw.js").catch((err) => {
            console.log("SW registration failed: ", err);
          });
        }

        loadApp();
      });
    </script>
  </body>
</html>
