name: Visual QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "tests/visual-glass-smoke.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "tailwind.config.js"
      - "src/index.css"

concurrency:
  group: visual-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SASE_BASE_URL: http://localhost:3101

jobs:
  visual-smoke:
    name: Glass Visual Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start app
        run: pnpm dev -- --port 3101 &

      - name: Wait for app
        run: npx --yes wait-on "$SASE_BASE_URL" --timeout 90000

      - name: Visual smoke
        run: pnpm exec node tests/visual-glass-smoke.js

      - name: Upload visual artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-artifacts
          path: qa_artifacts/visual-audit/
          if-no-files-found: error
