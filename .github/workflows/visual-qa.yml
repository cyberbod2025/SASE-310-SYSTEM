name: Visual QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "tests/visual-glass-smoke.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "tailwind.config.js"
      - "src/index.css"

concurrency:
  group: visual-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-smoke:
    name: Glass Visual Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Check lockfile exists
        run: test -f pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: Build for QA
        run: pnpm build

      - name: Start Preview
        run: nohup pnpm preview -- --host 127.0.0.1 --port 4173 --strictPort > visual-qa-preview.log 2>&1 &

      - name: Wait for app
        run: |
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 2
          done
          echo "La app no respondió en 4173"
          cat visual-qa-preview.log
          exit 1

      - name: Run visual smoke
        run: node tests/visual-glass-smoke.js

      - name: Upload visual artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-artifacts
          path: qa_artifacts/visual-audit/
          if-no-files-found: error
