name: Build Check

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "tooling/**"
      - "**/*.md"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "tooling/**"
      - "**/*.md"

concurrency:
  group: build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Frontend Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run type-check
        run: pnpm run type-check

      - name: Run tests
        run: pnpm run test

      - name: Build project
        run: pnpm run build
