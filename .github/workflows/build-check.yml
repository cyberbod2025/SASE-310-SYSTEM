name: Build Check

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "tooling/**"
      - "**/*.md"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "tooling/**"
      - "**/*.md"

concurrency:
  group: build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Frontend Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type-check
        run: npm run type-check

      - name: Run tests
        run: npm run test

      - name: Build project
        run: npm run build
