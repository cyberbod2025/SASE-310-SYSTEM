name: Security Audit

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - "docs/**"
      - "tooling/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "tooling/**"
  schedule:
    # Run weekly on Mondays at 9am UTC
    - cron: "0 9 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Job 1: Scan for exposed secrets
  secrets-scan:
    name: 🔐 Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER: true

  # Job 2: Audit npm dependencies for vulnerabilities
  dependency-audit:
    name: 📦 Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Generate audit report
        run: |
          echo "## 📋 Dependency Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          node -e "const {execSync}=require('node:child_process'); try { const raw=execSync('npm audit --json',{stdio:['ignore','pipe','pipe']}).toString(); const data=JSON.parse(raw); const m=data.metadata || {}; console.log(`Total: ${m.totalDependencies ?? 'n/a'} deps | Vulnerabilities: ${m.vulnerabilities?.total ?? 'n/a'}`);} catch (err) { const out=err.stdout?.toString?.() || ''; if (!out) { console.log('No vulnerabilities found'); process.exit(0);} const data=JSON.parse(out); const m=data.metadata || {}; console.log(`Total: ${m.totalDependencies ?? 'n/a'} deps | Vulnerabilities: ${m.vulnerabilities?.total ?? 'n/a'}`); process.exit(0);} " >> $GITHUB_STEP_SUMMARY

  # Job 3: Security checklist validation
  security-checklist:
    name: ✅ Security Checklist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for hardcoded secrets patterns
        run: |
          echo "🔍 Scanning for common secret patterns..."

          # Check for potential API keys, passwords, tokens
          if grep -rn --include="*.ts" --include="*.tsx" --include="*.js" \
            -E "(password|secret|api_key|apikey|token)\s*[:=]\s*['\"][^'\"]+['\"]" \
            --exclude-dir=node_modules --exclude-dir=dist . 2>/dev/null; then
            echo "⚠️ WARNING: Potential hardcoded secrets found!"
            exit 1
          else
            echo "✅ No hardcoded secrets detected"
          fi

      - name: Verify no admin client usage
        run: |
          echo "🔍 Checking for supabase.auth.admin usage in client code..."

          if grep -rn "supabase.auth.admin" \
            --include="*.ts" --include="*.tsx" \
            --exclude-dir=node_modules --exclude-dir=supabase --exclude-dir=api src/ 2>/dev/null; then
            echo "⚠️ WARNING: supabase.auth.admin found in client code!"
            echo "This should only be used in Edge Functions or server-side code."
            exit 1
          else
            echo "✅ No admin client usage in frontend"
          fi

      - name: Summary
        run: |
          echo "## 🛡️ Security Checklist Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ No hardcoded secrets detected" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ No supabase.auth.admin in client code" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Scan completed at $(date)_" >> $GITHUB_STEP_SUMMARY

  # Job 4: Audit Supabase Database Security (RLS & Views)
  supabase-audit:
    name: 🛡️ Supabase Database Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      - name: Start Supabase (Local Environment)
        run: |
          set -euo pipefail
          echo "🚀 Starting local database for audit..."
          # Preservamos el código de salida real de Supabase y filtramos solo el ruido.
          start_log="$(mktemp)"
          trap 'rm -f "$start_log"' EXIT

          if ! supabase db start --debug >"$start_log" 2>&1; then
            cat "$start_log"
            exit 1
          fi

          grep -v "Downloading" "$start_log" || true

          echo "📊 Verifying system status..."
          supabase status
          
          # ⏳ Espera táctica de 20 segundos para estabilización profunda
          echo "⏳ Waiting for database services to stabilize..."
          sleep 20

      - name: Run Database Lint (Local Migration Check)
        run: |
          echo "🔍 Auditing database migrations and schema consistency..."
          # Bucle de reintentos con mayor paciencia
          for i in {1..5}; do
            supabase db lint --local --fail-on warning && break || {
              if [ $i -eq 5 ]; then 
                echo "❌ FATAL: Database remained unreachable after multiple attempts."
                supabase status
                exit 1 
              fi
              echo "🔄 Retry $i: Database not ready, waiting 15s..."
              sleep 15
            }
          done
          echo "✅ Database schema passes all security and integrity standards."

      - name: Report Status
        run: |
          echo "## 🧬 Supabase Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Migrations are technically sound" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ RLS compliance verified (local check)" >> $GITHUB_STEP_SUMMARY
